  function paperPanel(a,period,unit,{compare=false,title='',animate=false,selector=false}={}){
    const r=period==='before'?1:ratio(a),value=period==='before'?before(a):after(a),labels=months();
    return `<section class="paper-panel ${period==='after'?'is-after':''} ${compare?'is-comparison':''}" aria-label="${esc(name(a))} ${period==='before'?'출시 전':'출시 뒤'} 기록"><div class="paper-panel-head"><strong>${title||(compare?'비교 문서':'연결 문서')}</strong><span>${period==='before'?labels[0]+' — '+labels[1]:labels[3]+' — '+labels[4]}</span></div>${selector?`<label class="comparison-select-label" for="comparison-select">다른 비교 문서 선택</label><select class="comparison-selector" id="comparison-select">${rows().filter(d=>!d.linked).map(d=>`<option value="${d.id}" ${d.id===a.id?'selected':''}>${esc(name(d))}${d.flagged?' · 분류 주의':''}</option>`).join('')}</select>`:`<h3>${esc(name(a))}</h3>`}${papers(r,unit,animate)}<div class="paper-value"><div><strong>${(r*100).toFixed(1).replace('.0','')}<span style="display:inline;font-size:13px;margin-left:3px">%</span></strong><span>출시 전을 100%로 맞춘 값</span></div><small>월평균 ${num(value)}회</small></div></section>`;
  }
  function hiddenPanel(action,label){return `<section class="paper-panel paper-hidden"><span class="folded-letter" aria-hidden="true"></span><p>${label}</p>${primary(action==='reveal'?'시간을 넘겨보기':'비교 기록 펼치기',action)}</section>`;}
  function stageChoose(){
    const all=rows(),linked=all.filter(a=>a.linked);
    return heading('엔딩 다음의 문서','이름 하나를 고르면, 기록이 펼쳐집니다.')+`<p class="lead-question">게임에서 만난 이름은<br>화면 밖에서도 더 읽혔을까요?</p><p class="article-lead"><strong>${esc(current().name)}</strong>의 영어 위키백과 문서에서 연결된 역사 이름들이에요.</p><div class="mission"><small>첫 번째 행동</small>기억에 남거나, 처음 들어서 궁금한 이름을 눌러보세요.</div><div class="section-title"><h2>연결된 역사 문서</h2><span class="section-note">${linked.length}개 중 하나 선택</span></div><p class="intro-note">‘연결’은 영어 위키백과 게임 문서의 링크 분류예요. 실제 게임 출연을 확인한 목록은 아니에요.</p><div class="wiki-index">${linked.map((a,i)=>`<div class="wiki-entry"><span>${String(i+1).padStart(2,'0')}</span><button data-action="choose" data-id="${a.id}">${esc(name(a))}<small>${esc(a.title.replaceAll('_',' '))}</small></button><span class="entry-arrow" aria-hidden="true">↗</span></div>`).join('')}</div><p class="choose-hint">어느 이름에서 시작해도 괜찮아요. 관심이 줄어든 문서도 만나게 될 수 있어요.</p>`;
  }
  function stageFirst(){
    const a=selected(),unit=unitFor(a),r=ratio(a),diff=percent(r),labels=months();
    const change=r>=1?`출시 뒤에는 이 문서가 전보다 <strong>${Math.abs((r-1)*100).toFixed(1)}% 더 읽혔어요.</strong>`:`출시 뒤에는 이 문서가 전보다 <strong>${Math.abs((r-1)*100).toFixed(1)}% 덜 읽혔어요.</strong>`;
    return heading(esc(name(a)),`${esc(a.title.replaceAll('_',' '))} / 연결 문서`)+`<p class="article-lead">지금 보는 것은 문서의 내용이 아니라, 사람들이 이 문서를 열어본 기록이에요. <strong>출시 전의 관심을 100%로 맞춰 놓고</strong> 시간을 넘겨볼게요.</p><div class="period-bookmark"><span>시간의 책갈피</span><b class="date-chip">${current().date.replaceAll('-','.')} 게임 출시</b><span>출시 달은 전후 비교에서 제외</span></div><div class="paper-reading">${paperPanel(a,'before',unit,{title:'출시 전 두 달'})}${state.revealed?paperPanel(a,'after',unit,{title:'출시 뒤 두 달',animate:true}):hiddenPanel('reveal','아직 접혀 있는<br>출시 뒤 두 달의 기록')}</div>${legend(unit)}${state.revealed?`<div class="reading-note">${change} <span>하지만 이 한 장면으로는 이유를 알 수 없어요.</span><br><button class="inline-link" data-action="record" data-id="${a.id}">실제 월별 수치와 출처 읽기</button></div><div class="choice-section"><h2>다른 역사 문서도 그랬을까요?</h2><p>먼저 생각을 골라보세요. 예상은 정답으로 채점하지 않아요.</p><div class="prediction-choices"><button class="choice" data-action="predict" data-value="different"><span class="choice-symbol">≠</span><span>관심은 문서마다<br>다르게 움직였을 것 같아요.</span></button><button class="choice" data-action="predict" data-value="similar"><span class="choice-symbol">≈</span><span>같은 시기라면<br>비슷하게 움직였을 것 같아요.</span></button></div><div class="quiet-action"><button class="inline-link" data-action="choose-again">다른 이름 고르기</button><button class="inline-link" data-action="predict" data-value="skip">예상 없이 비교 기록 보기</button></div></div>`:`<p class="story-note">종이 한 장 한 장은 관심의 흔적이에요. 출시 뒤의 기록을 열면, 늘어난 관심과 사라진 관심이 같은 자리에서 드러나요.</p>`}`;
  }
  function comparisonNote(){const a=selected(),b=comparison(),ra=ratio(a),rb=ratio(b);if(state.period==='before')return '두 문서 모두 자신의 출시 전 관심을 100%로 맞췄어요. 실제 월평균 조회수는 달라요. 이제 같은 기준으로 출시 뒤를 볼 수 있어요.';const direction=ra>rb?'더 높은':ra<rb?'더 낮은':'같은';return `<strong>${esc(name(a))}</strong>의 전후 배수는 ${ra.toFixed(2)}배, <strong>${esc(name(b))}</strong>은 ${rb.toFixed(2)}배예요. 선택한 연결 문서의 전후 배수가 ${direction} 값을 보였어요. 이 한 쌍이 전체 문서의 결과를 대신하지는 않아요.`;}
  function stageCompare(){const a=selected(),b=comparison(),unit=unitFor(a,b);return heading('같은 시간을 보낸 두 문서.','비슷한 시기의 다른 역사 문서와 나란히 읽기')+`<p class="article-lead">게임 문서에 연결되지 않은 비교 문서를 옆에 놓았어요. <strong>둘 다 자기 자신의 출시 전 관심을 100%로 맞춥니다.</strong> 같은 시간 동안 관심이 어떻게 움직였는지 확인해 보세요.</p><div class="comparison-controls">${state.compRevealed?`<div class="time-switch" role="group" aria-label="비교 시점"><button data-action="period" data-value="before" aria-pressed="${state.period==='before'}">출시 전</button><button data-action="period" data-value="after" aria-pressed="${state.period==='after'}">출시 뒤</button></div>`:'<span>연결 문서의 기록은 펼쳤고, 비교 문서는 아직 접혀 있어요.</span>'}<span>${current().date.replaceAll('-','.')} 출시 기준</span></div><div class="paper-reading">${paperPanel(a,state.period,unit,{animate:state.compRevealed})}${state.compRevealed?paperPanel(b,state.period,unit,{compare:true,selector:true,animate:true}):hiddenPanel('reveal-comparison',`비교 문서<br><strong>${esc(name(b))}</strong>`)}</div>${legend(unit)}${state.compRevealed?`<div class="observation">${state.prediction?`<p class="your-thought">나의 예상: ${predictions[state.prediction]}</p>`:''}<p>${comparisonNote()}</p></div>${b.flagged?'<p class="context-note">이 비교 문서는 원자료에서 분류 주의 대상으로 표시됐어요. 다른 비교 문서도 선택해 보세요.</p>':''}<div class="stage-actions"><button class="inline-link" data-action="pair-details">두 문서의 실제 수치</button>${primary('전체 문서에서도 확인하기','all-pages')}</div>`:`<p class="story-note">기본 비교 대상은 원자료 목록의 첫 번째 비교 문서예요. 기록을 펼친 뒤 다른 문서로 바꿔볼 수 있어요.</p>`}`;}
  function shelf(list,title,compare=false){return `<section class="shelf"><div class="shelf-title"><strong>${title}</strong><span>${list.length}개 문서</span></div><div class="book-row">${list.map(a=>`<button class="book ${compare?'comparison':''}" data-action="record" data-id="${a.id}" aria-label="${esc(name(a))}, 출시 뒤 ${ratio(a).toFixed(2)}배, 실제 기록 보기" title="${esc(name(a))} ${ratio(a).toFixed(2)}배"><span class="book-title">${esc(name(a))}</span><small>${ratio(a)>=1?'↑':'↓'} ${ratio(a).toFixed(2)}</small></button>`).join('')}</div></section>`;}
  function finalFacts(){const group=rows().filter(a=>!state.exclude||!a.flagged),linked=group.filter(a=>a.linked),comp=group.filter(a=>!a.linked);return {linked,comp,lr:median(linked.map(ratio)),cr:median(comp.map(ratio))};}
  function discovery(){const {linked,comp,lr,cr}=finalFacts();const responses={learn:'조회 기록만으로 누가 읽었는지, 실제로 무엇을 배웠는지는 알 수 없어요. 학습의 증거로 해석하려면 다른 자료가 필요해요.',attention:'문서 집단을 비교하면 이 차이까지는 관찰할 수 있어요. 다만 그 차이의 원인이 게임이라고 단정할 수는 없어요.',same:'이번에 선정한 문서들에서는 두 집단의 전후 변화가 같지 않았어요. 각 문서의 변화도 서로 달랐고요.'};return `<section class="discovery" id="discovery" tabindex="-1"><p class="discovery-label"><span aria-hidden="true">✧</span>나의 발견에 붙이는 주석</p><p class="response">${responses[state.interpretation]}</p><h2>게임은 역사에 대한 관심의<br>입구가 될 수 있을까요?</h2><div class="discovery-facts"><div><span>연결 문서 ${linked.length}개</span><strong>${lr.toFixed(2)}배</strong><small>전후 변화 ${percent(lr)}</small></div><div><span>비교 문서 ${comp.length}개</span><strong>${cr.toFixed(2)}배</strong><small>전후 변화 ${percent(cr)}</small></div></div><p>선정한 <strong>${esc(current().name)}</strong>의 문서들에서는, 연결 문서의 전후 조회 변화가 비교 문서보다 컸어요. 각 문서의 전후 배수를 구한 뒤 집단의 중앙값으로 비교한 결과예요.</p><p><strong>관심이 이어졌을 가능성은 남아요.</strong> 하지만 게임 이용자가 읽었는지, 게임 때문에 읽었는지, 무엇을 배웠는지는 이 기록에 없어요.</p><p class="context-note">원자료 맥락: ${esc(current().note)}</p><div class="ending-actions">${primary('다른 게임에서 다시 탐색','next-game')}<button class="secondary" data-action="methods">자료·계산법 읽기</button></div></section>`;}
  function stageAll(){const {linked,comp}=finalFacts();return heading('한 문서에서, 문서들의 서가로.','선택한 한 쌍을 넘어 전체 표본 확인하기')+`<p class="article-lead">한 문서가 많이 읽혔다고 모든 문서가 그런 것은 아니에요. ${esc(current().name)}의 <strong>전체 표본</strong>을 펼쳐보세요. 각 책등을 누르면 실제 기록을 읽을 수 있어요.</p><div class="shelves">${shelf(linked,'연결 문서')}${shelf(comp,'비교 문서',true)}</div><p class="shelf-caption">책은 모두 같은 크기예요. ↑는 출시 전보다 증가, ↓는 감소. 숫자는 출시 뒤 / 출시 전 배수예요. 책등의 크기는 수치를 나타내지 않아요.</p><label class="sensitivity"><input type="checkbox" id="exclude-flagged" ${state.exclude?'checked':''}>분류 주의 비교 문서 제외 (${rows().filter(a=>a.flagged).length}개) · 나머지 게임을 포함하면 총 4개</label><div class="choice-section"><h2>이 기록으로 어디까지 말할 수 있을까요?</h2><p>자신의 해석을 골라보세요. 이어지는 주석에서 자료와 대조할 수 있어요.</p><div class="interpretations"><button class="interpretation" data-action="interpret" data-value="learn" aria-pressed="${state.interpretation==='learn'}"><span>A</span><span>게임을 한 사람들이<br>역사를 공부했다.</span></button><button class="interpretation" data-action="interpret" data-value="attention" aria-pressed="${state.interpretation==='attention'}"><span>B</span><span>선정한 연결 문서들이 비교 문서보다<br>더 큰 조회 변화를 보였다.</span></button><button class="interpretation" data-action="interpret" data-value="same" aria-pressed="${state.interpretation==='same'}"><span>C</span><span>같은 시기 역사 문서들의 관심은<br>모두 비슷하게 변했다.</span></button></div></div>${state.interpretation?discovery():''}`;}
  function renderNotebook(){const a=selected(),b=comparison(),all=rows();$('notebook').innerHTML=`<div class="info-box"><h2>지금 탐색하는 게임</h2><div class="info-art" aria-hidden="true"><i class="cover-page"></i><i class="cover-page"></i><i class="cover-page"></i></div><p class="info-caption">플레이 이후의 관심을<br>문서 기록에서 찾아보는 작은 실험</p><label class="game-select-label" for="game-select">게임을 바꾸면 새 탐색을 시작해요</label><div class="game-select-wrap"><select id="game-select" aria-label="탐색할 게임 선택">${games.map((g,i)=>`<option value="${i}" ${state.game===i?'selected':''}>${g.name}</option>`).join('')}</select></div><dl><dt>출시</dt><dd>${current().date.replaceAll('-','.')}</dd><dt>문서</dt><dd>연결 ${all.filter(a=>a.linked).length}개<br>비교 ${all.filter(a=>!a.linked).length}개</dd><dt>자료</dt><dd>영어 위키백과<br>문서별 조회수</dd></dl></div><div class="memo"><div class="memo-title">나의 발견 노트 <span>${Number(state.revealed)+Number(state.compRevealed)}개의 단서</span></div>${a?`<div class="memo-item"><small>선택한 이름</small><strong>${esc(name(a))}</strong>${state.revealed?`출시 뒤 ${ratio(a).toFixed(2)}배`:''}</div>`:'<p class="memo-empty">이름을 누르면<br>여기에 기록이 쌓여요.</p>'}${state.prediction?`<div class="memo-item"><small>나의 예상</small>${predictions[state.prediction]}</div>`:''}${state.compRevealed?`<div class="memo-item"><small>함께 본 비교 문서</small><strong>${esc(name(b))}</strong>출시 뒤 ${ratio(b).toFixed(2)}배</div>`:''}${state.interpretation?'<div class="memo-item"><small>남겨둔 질문</small>관심이 늘어난 것과,<br>학습한 것은 같은 걸까요?</div>':''}</div>`;}
  function renderSteps(){const labels=['문서 고르기','시간 넘기기','나란히 읽기','나의 발견'];$('steps').innerHTML=labels.map((label,i)=>`<button class="step ${i<state.highest?'done':''}" data-action="step" data-stage="${i}" ${i>state.highest?'disabled':''} ${state.stage===i?'aria-current="step"':''}><span class="step-dot" aria-hidden="true">${i<state.highest?'✓':i+1}</span><span>${label}</span></button>`).join('');$('chapter-label').textContent=`${state.stage+1} / 4 · ${labels[state.stage]}`;}
  function render(focus=false){renderSteps();renderNotebook();$('content').innerHTML=[stageChoose,stageFirst,stageCompare,stageAll][state.stage]();if(focus){$('stage-heading').focus({preventScroll:true});$('article').scrollIntoView({block:'start',behavior:'instant'});} }
  function monthTable(list){const labels=months();return `<div class="table-scroll"><table><caption class="sr-only">월별 실제 조회수</caption><thead><tr><th scope="col">문서</th>${labels.map(m=>`<th scope="col">${m}</th>`).join('')}</tr></thead><tbody>${list.map(a=>`<tr><th scope="row">${esc(name(a))}</th>${a.views.map(v=>`<td>${num(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
  function showDialog(html){$('dialog-body').innerHTML=html;if(!$('detail-dialog').open)$('detail-dialog').showModal();}
  function openRecord(id){const a=articles.find(a=>a.id===id),g=games.find(g=>g.id===a.game);showDialog(`<h2 id="dialog-title">${esc(name(a))}</h2><p>${esc(a.title.replaceAll('_',' '))} / ${a.linked?'연결 문서':'비교 문서'}</p>${monthTable([a])}<p>출시 전 두 달 월평균 <strong>${num(before(a))}회</strong>, 출시 뒤 <strong>${num(after(a))}회</strong>.<br>전후 배수는 <strong>${ratio(a).toFixed(2)}배</strong> (${percent(ratio(a))})예요.</p>${a.flagged?'<p>원자료에서 비교 집단 분류에 주의가 필요하다고 표시한 항목이에요.</p>':''}<div class="source-links"><a href="${wiki(a.title)}" target="_blank" rel="noopener">실제 위키백과 문서 읽기 ↗</a><a href="${wiki(g.wiki)}" target="_blank" rel="noopener">게임의 위키백과 문서 ↗</a><a href="${window.AFTERPLAY_DATA.source}" target="_blank" rel="noopener">원자료 시트 확인 ↗</a></div><p class="dialog-foot">출시 달은 전후 계산에서 제외했어요. 이 월별 기록은 실제 조회 횟수이며, 고유 독자 수나 학습 성과를 뜻하지 않아요.</p>`);}
  function methods(){showDialog(`<h2 id="dialog-title">이 전시의 자료와 읽는 법</h2><p>AFTERPLAY는 게임의 출시일과 역사 문서의 조회 기록을 연결한 <strong>비공식 인터랙티브 데이터 전시</strong>예요. 위키백과의 문서 구조를 빌렸지만, 실제 Wikipedia 화면이나 공식 서비스는 아니에요.</p><h3>두 데이터는 어떻게 연결했나요?</h3><p><strong>데이터 A</strong>는 게임 출시일과 영어 위키백과 게임 문서의 역사 관련 링크예요. <strong>데이터 B</strong>는 Wikimedia 문서별 조회수예요. 문서 제목과 출시일로 연결했어요.</p><p>사용자가 제공한 조사 시트에서 2026년 11월 2일 옮긴 4개 게임·58개 문서(연결 27개, 비교 31개)의 수치로 다시 계산했어요. 현재 API를 실시간 호출하는 화면은 아니에요.</p><h3>‘연결 문서’는 실제 게임 등장인물인가요?</h3><p>아니에요. 원자료는 영어 게임 위키 문서가 해당 역사 문서를 링크하는지로 분류했어요. 실제 게임 출연 여부나 출시 당시 링크 상태가 검증된 분류는 아니에요. 분류 주의 대상으로 표시된 비교 문서 4개를 제외해 볼 수 있어요.</p><h3>종이 한 장은 무엇을 뜻하나요?</h3><p>각 문서의 출시 전 두 달 월평균을 100%로 삼았어요. 기본적으로 종이 한 장은 그 값의 10%예요. 표시할 최대 배수가 6배를 넘으면 한 장=50%, 20배를 넘으면 한 장=100%로 바꾸고 화면에 표시해요. 나란히 놓인 두 문서에는 같은 단위를 적용해요.</p><p>일부만 채운 마지막 종이는 남은 비율을 뜻해요. 종이는 실제 페이지 수나 독자 수가 아니에요. 서로 다른 문서의 절대 조회수가 같다는 뜻도 아니에요.</p><h3>배수와 전체 결과는 어떻게 계산했나요?</h3><p>문서별 배수 = 출시 뒤 두 달 월평균 ÷ 출시 전 두 달 월평균. 출시 달은 제외해요. 집단 결과는 이 배수의 중앙값이에요. 월 길이에 따른 일수 차이는 보정하지 않았어요.</p><h3>여기서 알 수 없는 것은 무엇인가요?</h3><p>누가 읽었는지, 게임 때문에 읽었는지, 무엇을 배웠는지는 알 수 없어요. 영어 위키백과의 ‘user’ 분류 조회 횟수이며 고유 이용자 수가 아니에요. 임의로 선정한 작은 표본이라 모든 게임으로 일반화할 수도 없어요.</p><p>뉴스·계절성·다른 매체도 관심에 영향을 줘요. 발할라 시기에는 TV 시리즈 〈Vikings〉 마지막 시즌 후반부 공개가 겹쳤어요. <a href="https://www.corusent.com/news/final-season-of-historys-hit-drama-series-vikings-comes-to-monumental-conclusion-january-1/" target="_blank" rel="noopener">방송사 일정 ↗</a></p><h3>왜 위키와 게임의 형태인가요?</h3><p>파란 문서 링크와 목차는 ‘읽다 보니 다른 이름이 궁금해지는’ 위키의 경험을 만들어요. 기록 펼치기와 예상·비교는 게임의 탐색 흐름이에요. 결론을 첫 화면에서 알려주지 않고, 관람자가 자신의 해석과 실제 기록을 대조하도록 설계했어요. 선택은 정답으로 채점하지 않으며 개인 정보나 답변을 서버에 저장하지 않아요.</p><div class="source-links"><a href="${window.AFTERPLAY_DATA.source}" target="_blank" rel="noopener">사용자가 제공한 월별 원자료 시트 ↗</a><a href="https://doc.wikimedia.org/generated-data-platform/aqs/analytics-api/" target="_blank" rel="noopener">Wikimedia 조회수 API 안내 ↗</a></div><button class="secondary" data-action="download">58개 문서의 원자료 내려받기 ↓</button><p class="download-message" id="download-message" role="status"></p>`);}
  function download(){const cell=s=>'"'+String(s).replaceAll('"','""')+'"';const header=['game','release_date','article','korean_label','group','classification_caution','month_minus_2','month_minus_1','release_month','month_plus_1','month_plus_2','before_monthly_mean','after_monthly_mean','after_before_ratio'];const csv='\uFEFF'+[header,...articles.map(a=>[a.game,games.find(g=>g.id===a.game).date,a.title,name(a),a.linked?'linked':'comparison',a.flagged,...a.views,before(a),after(a),ratio(a)])].map(row=>row.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='afterplay-58-history-pages.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);if($('download-message'))$('download-message').textContent='58개 문서의 월별 원자료 CSV를 내려받았어요.';}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const act=b.dataset.action;
    if(act==='choose'){if($('detail-dialog').open)$('detail-dialog').close();state.selected=Number(b.dataset.id);state.comparison=rows().find(a=>!a.linked).id;state.revealed=false;state.compRevealed=false;state.prediction=null;state.interpretation=null;state.highest=1;go(1);}
    else if(act==='reveal'){state.revealed=true;render();const next=document.querySelector('.choice-section h2');next.tabIndex=-1;next.focus({preventScroll:true});$('status').textContent=`출시 뒤 기록이 펼쳐졌어요. ${name(selected())}, 전후 ${ratio(selected()).toFixed(2)}배.`;}
    else if(act==='predict'){state.prediction=b.dataset.value==='skip'?null:b.dataset.value;state.period='after';go(2);}
    else if(act==='reveal-comparison'){state.compRevealed=true;state.period='after';render();$('comparison-select').focus({preventScroll:true});$('status').textContent=`비교 기록이 펼쳐졌어요. ${name(comparison())}, 전후 ${ratio(comparison()).toFixed(2)}배.`;}
    else if(act==='period'){state.period=b.dataset.value;render();document.querySelector(`[data-action="period"][data-value="${state.period}"]`).focus({preventScroll:true});}
    else if(act==='all-pages'){go(3);}
    else if(act==='interpret'){state.interpretation=b.dataset.value;render();$('discovery').focus({preventScroll:true});$('discovery').scrollIntoView({behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});}
    else if(act==='choose-again'){go(0);}
    else if(act==='step'){go(Number(b.dataset.stage));}
    else if(act==='restart'){reset();}
    else if(act==='next-game'){reset((state.game+1)%games.length);}
    else if(act==='methods'){methods();}
    else if(act==='record'){openRecord(Number(b.dataset.id));}
    else if(act==='close'){$('detail-dialog').close();}
    else if(act==='pair-details'){showDialog(`<h2 id="dialog-title">두 문서의 실제 기록</h2>${monthTable([selected(),comparison()])}<p>연결 문서 ${esc(name(selected()))}: ${ratio(selected()).toFixed(2)}배<br>비교 문서 ${esc(name(comparison()))}: ${ratio(comparison()).toFixed(2)}배</p><p class="dialog-foot">출시 달을 제외한 전후 두 달의 월평균을 비교했어요.</p>`);}
    else if(act==='download'){download();}
  });
  document.addEventListener('change',e=>{if(e.target.id==='game-select')reset(Number(e.target.value));else if(e.target.id==='comparison-select'){state.comparison=Number(e.target.value);render();$('comparison-select').focus({preventScroll:true});}else if(e.target.id==='exclude-flagged'){state.exclude=e.target.checked;render();$('exclude-flagged').focus({preventScroll:true});$('status').textContent=state.exclude?'분류 주의 비교 문서를 제외한 결과예요.':'전체 비교 문서를 포함한 결과예요.';}});
  $('search-form').addEventListener('submit',e=>{e.preventDefault();const query=$('global-search').value.trim().toLocaleLowerCase();const found=rows().filter(a=>(name(a)+' '+a.title.replaceAll('_',' ')).toLocaleLowerCase().includes(query));showDialog(`<h2 id="dialog-title">역사 문서 검색</h2><p>${esc(current().name)} · ${found.length}개 문서</p>${found.length?`<div class="wiki-index">${found.map(a=>`<div class="wiki-entry"><button data-action="${a.linked?'choose':'record'}" data-id="${a.id}">${esc(name(a))}<small>${a.linked?'연결 문서 · 새 탐색 시작':'비교 문서 · 실제 기록 열람'}</small></button></div>`).join('')}</div>`:'<p>일치하는 이름이 없어요. 창을 닫고 다른 이름이나 영어 이름으로 검색해 보세요.</p>'}`);});
  $('brand-home').addEventListener('click',e=>{e.preventDefault();reset(0);});
  $('detail-dialog').addEventListener('click',e=>{if(e.target===$('detail-dialog')){const r=$('detail-dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('detail-dialog').close();}});
  render();
})();

</script></body></html>
