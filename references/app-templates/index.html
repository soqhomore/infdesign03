<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>행복버튼 — 한 번의 면접</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./game.css">
  <link rel="stylesheet" href="./face-editor.css">
  <script type="importmap">{"imports":{"three":"./vendor/build/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <main id="stage" aria-label="입체 면접실. 둘러보기 버튼을 누르면 마우스로 공간을 회전할 수 있습니다."></main>
  <div id="loading" role="status"><span></span><p>면접실을 준비하고 있어요</p><small id="load-detail">재질과 조명 불러오는 중</small></div>
  <header><span class="scene-title">면접실</span><button id="hide-ui" aria-label="조작 메뉴 숨기기">메뉴 숨기기</button></header>
  <aside id="settings" hidden>
    <div class="setting-head"><strong>공간 설정</strong><button id="close-settings" aria-label="설정 닫기">×</button></div>
    <label>실내 밝기 <output id="exposure-value">1.00</output><input id="exposure" type="range" min="0.55" max="1.6" step="0.05" value="1"></label>
    <label>블라인드 올리기 <output id="blinds-value">0%</output><input id="blinds" type="range" min="0" max="75" step="1" value="0"></label>
    <label class="check"><input type="checkbox" id="ao" checked> 접촉부 음영</label>
    <label class="check"><input type="checkbox" id="quality" checked> 고화질</label>
    <small>시점을 바꾸며 책상·의자·재질을 확인할 수 있어요.</small>
  </aside>
  <footer id="toolbar"><div class="view-buttons"><button id="home" class="active">지원자 시점</button><button id="orbit">둘러보기</button></div><span class="divider"></span><button id="faces-toggle" disabled>얼굴 바꾸기</button><button id="settings-toggle">조명·공간</button><button id="capture">화면 저장</button><button id="fullscreen" aria-label="전체 화면">전체화면</button></footer>
  <p id="hint">사진을 참고한 세 면접관 · 둘러보기로 입체 형태를 확인할 수 있어요</p>
  <button id="show-ui" hidden>메뉴 보기</button>
  <div id="notice" role="status"></div>
  <script type="module" src="./scene.js"></script>
</body>
</html>
